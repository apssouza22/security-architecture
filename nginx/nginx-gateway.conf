# ------------------------------------------------------ #
# NGINX configuration file for app gateway delegating auth to authentication service
# ------------------------------------------------------ #

load_module modules/ngx_http_js_module.so; # Load the NJS module

events {
    worker_connections  1024; # Set the maximum number of simultaneous connections
}

worker_processes  auto; # Automatically determine the number of worker processes
error_log /dev/stdout debug; # Log errors to stdout with debug level

http {
    # Define a custom log format
    log_format custom '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$ssl_client_s_dn"';

    access_log /var/log/nginx/access.log custom; # Use the custom log format for access logs
    include       /etc/nginx/mime.types; # Include MIME types
    subrequest_output_buffer_size 256k; # Increase buffer size for subrequests

    # Custom JS code scripts
    js_path "/etc/nginx/njs/"; # Set the path for JS scripts
    js_import authn from authn.js; # Import the authn module from authn.js

    subrequest_output_buffer_size 512k; # Increase buffer size for subrequests
    client_max_body_size    512m;

    large_client_header_buffers   8 64k;
    client_header_buffer_size     16k;

    # Add these lines to handle large headers
    proxy_read_timeout      60;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    server {
        listen 8881 ssl;
        listen [::]:8881 ssl;
        http2 on;
        server_name authn.proxy;

        ssl_certificate data:$dynamic_ssl_cert;
        ssl_certificate_key data:$dynamic_ssl_key;

        ssl_trusted_certificate /etc/nginx/certs/ca.crt; # verify chain of trust of OCSP response using Root CA and Intermediate certs

        ssl_session_timeout       1d;
        ssl_session_cache         shared:MozSSL:10m;  # about 40000 sessions
        ssl_session_tickets       off;
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;

        # HSTS (ngx_http_headers_module is required) (63072000 seconds)
        add_header Strict-Transport-Security "max-age=63072000" always;

        location @authn_gateway_proxy {
            proxy_set_header        Host $host;
            proxy_set_header        X-Real-IP $remote_addr;
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;
            proxy_set_header        X-Forwarded-Host $http_host;
            proxy_pass              http://127.0.0.1:7002;
        }

        location / {
          try_files $uri @authn_gateway_proxy;
        }

        # ---------------------------------------------------------------------- #
        # App proxy configuration
        # ---------------------------------------------------------------------- #
        location /app {
            auth_request /_authenticate;
            auth_request_set $authToken $upstream_http_x_auth_token;
            auth_request_set $upstream_uri $upstream_http_x_upstream_url;
            auth_request_set $auth_set_cookie $upstream_http_x_set_cookie;

            # Handle auth_request errors
            error_page 401 = @login_redirect;

            proxy_set_header        Authorization $authToken;
            proxy_set_header        Host $host;
            proxy_set_header        X-Real-IP $remote_addr;

            proxy_pass $upstream_uri;
            js_header_filter authn.handleRespHeader;
        }

        location = /_authenticate {
            internal;
            proxy_pass http://127.0.0.1:7001/authn_check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }


        location @login_redirect {
            try_files $uri @authn_gateway_proxy;
        }
    }

    # required for auth_request to work with auth_request_set
    server {
      listen 127.0.0.1:7001;

      location = /authn_check {
          js_content authn.authCheck;
      }

      location = /_authn {
          internal;
          proxy_pass http://127.0.0.1:7002/auth/check;

          #proxy_pass http://host.docker.internal:8080/auth/check;
      }
    }

    # Dummy backend service to demonstrate the gateway functionality
    server {
      listen 127.0.0.1:7002;
      return 200 "{'upstreamUrl': 'http://host.docker.internal:8080', 'token': 'dummy-token'}";
    }
}
